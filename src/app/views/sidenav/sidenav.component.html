<div>
  <input type="checkbox" name="" id="sidebar-toggle" />

  <!-- Sidebar -->
  <section class="sidenav">
    <div class="logo-empresa">
      <span class="logo-text">Notas Fiscais</span>
    </div>
    <div class="side-menu">
      <ul>
        <li class="side-item">
          <a routerLink="/principal/despesas" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: false }">
            <mat-icon class="side-icon">receipt_long</mat-icon>
            <span>Comprovantes</span>
          </a>
        </li>

      </ul>
    </div>
  </section>

  <!-- Conteúdo principal -->
  <section class="content">
    <nav class="nav">
      <label for="sidebar-toggle" class="nav-menu">
        <mat-icon>menu</mat-icon>
      </label>
      <div class="nav-data">
        <button mat-button [matMenuTriggerFor]="userMenu" class="nav-user-btn">
          <mat-icon>account_circle</mat-icon>
          <span class="nav-user">{{ userName }}</span>
          <mat-icon>arrow_drop_down</mat-icon>
        </button>
        <mat-menu #userMenu="matMenu">
          <button mat-menu-item (click)="openMeuPerfil()">
            <mat-icon>person</mat-icon>
            <span>Minhas Informações</span>
          </button>
          <button mat-menu-item (click)="navigateUsuarios()" *ngIf="isAdmin">
            <mat-icon>people</mat-icon>
            <span>Usuários</span>
          </button>
        </mat-menu>
        <span class="nav-divider"></span>
        <button mat-icon-button matTooltip="Sair" (click)="logout()">
          <mat-icon>logout</mat-icon>
        </button>
      </div>
    </nav>
    <main class="main">
      <router-outlet></router-outlet>
    </main>
  </section>

  <label for="sidebar-toggle" class="body-label"></label>
</div>
